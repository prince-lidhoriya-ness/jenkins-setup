# Test app for the gates. Run ONE variant at a time (both use port 8080).
#   docker compose -f samples/docker-compose.yml --profile legacy up -d --build
#   docker compose -f samples/docker-compose.yml --profile modernized up -d --build
services:
  patient-service-legacy:
    profiles: [legacy]
    build: ./legacy-app
    ports: ["8080:8080"]
  patient-service-modernized:
    profiles: [modernized]
    build: ./modernized-app
    ports: ["8080:8080"]
