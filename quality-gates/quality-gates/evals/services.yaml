# Base URL of every service the evals call (as seen from INSIDE the runner container).
# Docker Desktop: host.docker.internal reaches ports published on your laptop.
# On Jenkins / same compose network: use container names, e.g. http://patient-service:8080
services:
  patient-service: http://host.docker.internal:8080
